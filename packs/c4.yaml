# C4 — structural validators of the Architect Assistant (prompt §6.3, ADR-032/033). Deterministic
# CEL over the C4 reading of the graph model: findings only from rules, never from the LLM.
pack: c4
version: 0.4.0
regimes: [MCSB, NIST, ISO, MSFT, OWASP, MAESTRO]
offer: agentic
rules:
  - id: STR-001
    title: Component declared without a containing element
    scope: node
    severity: low
    # Amended (docs/18 WS-I I2, structure-quality): c4.Classify reads a node with c4_kind Component and no c4_level as
    # a component, so the rule does too; the projection-agreement test (swarm/intake-and-model) holds them together.
    condition: |
      (attr(n, "c4_level", "") == "component" || (attr(n, "c4_level", "") == "" && attr(n, "c4_kind", "") == "Component")) &&
      attr(n, "c4_parent", "") == ""
    message: "{{n.name}} is declared a C4 component (by its level or its kind) but names no containing container (c4_parent)."
    clauses: [NIST:AIRMF:MAP]
    remediation: "Set attrs.c4_parent to the container the component belongs to, or lift it to container level."
    fixtures: { positive: fixtures/STR-001.pos.json, negative: fixtures/STR-001.neg.json }
    tags: [c4, structure]

  - id: STR-002
    title: Relationship crosses a boundary without authentication
    scope: edge
    severity: high
    condition: |
      e.kind in ["calls","reads","writes","delegates","executes"] &&
      e.from.type != "user" && e.from.type != "external_party" &&
      size(e.from.group_ids) + size(e.to.group_ids) > 0 &&
      !e.from.group_ids.exists(gid, gid in e.to.group_ids) &&
      e.auth in ["", "none", "unknown"]
    message: "{{e.from.name}} → {{e.to.name}} crosses a boundary without an authenticated identity (auth={{e.auth}})."
    clauses: [NIST:800-207:S2, MCSB:v1:IM-1, MSFT:EntraAgentID]
    remediation: "Authenticate the hop with a managed identity, an agent identity or OBO token exchange scoped to the callee."
    patch_template:
      - { op: replace, path: "/edges/{{e.id}}/auth", value: managed_identity }
    fixtures: { positive: fixtures/STR-002.pos.json, negative: fixtures/STR-002.neg.json }
    tags: [c4, zero-trust, boundary]

  - id: STR-003
    title: Accepted decision without a citation
    scope: graph
    severity: medium
    condition: |
      attr(g, "decisions", []).exists(d, d.status == "accepted" && (!("citations" in d) || size(d.citations) == 0))
    message: "At least one accepted architecture decision carries no citation (clause or documentation)."
    clauses: [NIST:AIRMF:GOVERN, ISO:42001:A.3.2]
    remediation: "Attach the clause ids and the documentation the decision rests on before accepting it (citation coverage of accepted decisions)."
    fixtures: { positive: fixtures/STR-003.pos.json, negative: fixtures/STR-003.neg.json }
    tags: [c4, decisions, citations]

  - id: STR-004
    title: Container calls other components without a workload identity
    scope: node
    severity: high
    condition: |
      n.type in ["app","api","gateway","tool","mcp_server"] &&
      g.out(n.id, "").exists(x, x.kind in ["calls","reads","writes","executes","delegates"]) &&
      !(attr(n, "identity", "") in ["managed_identity","agent_id"]) &&
      !g.out(n.id, "").exists(x, x.auth in ["managed_identity","agent_id","obo","oauth_client","mtls"])
    message: "{{n.name}} calls other components but declares no workload identity, and none of its outgoing hops is authenticated with one."
    clauses: [MCSB:v1:IM-3, MCSB:v1:IM-1, NIST:800-207:S2]
    remediation: "Give the container a managed identity (identity=managed_identity) and authenticate its outgoing calls with it (auth=managed_identity, mtls or oauth_client); agents use agent_id (ZT-002)."
    patch_template:
      - { op: add, path: "/nodes/{{n.id}}/attrs/identity", value: managed_identity }
    fixtures: { positive: fixtures/STR-004.pos.json, negative: fixtures/STR-004.neg.json }
    tags: [c4, identity, zero-trust]

  - id: STR-005
    title: Agent reaches an MCP server with no gateway on the path
    scope: edge
    severity: medium
    # All paths (ADR-088 §1, B2a): the hop into the server fires when an agent reaches its source by some walk that
    # enters no gateway of kind "ai", "api" or "mcp" (schema 1.1) and the source is not one itself, so a direct edge
    # beside a gated route and an agent → tool → server chain both report on the last ungated hop. A WAF or a gateway
    # of no declared kind does not count. A hop out of a human step is the person's action, not the agent's
    # (ADR-088 Amendments).
    # Gateway functions (B2b): a gateway counts when it declares `identity_termination` in functions[] (it terminates
    # the agent's token and calls the server under its own audience-scoped identity), whatever its kind; one that
    # declares no functions counts by its kind (ai, api, mcp). `requires` reports the hop out of a kind-credited
    # gateway not_checked (facts_missing); one further up the walk is decided (docs/03 Known limits). The walk (the
    # function-aware g.upstreamAvoiding of cel.go) stops at a gateway that credits the hop and walks through every
    # other one, at any chain length.
    condition: |
      e.to.type == "mcp_server" && e.from.type != "human_step" &&
      !(e.from.type == "gateway" && cel.bind(fs, attr(e.from, "functions", []), size(fs) > 0 ? "identity_termination" in fs : attr(e.from, "kind", "") in ["ai", "api", "mcp"])) &&
      (e.from.type == "gateway" ? g.in(e.from.id, "").map(x, x.from.id) : [e.from.id]).exists(s,
        g.upstreamAvoiding(s, ["gateway"], ["ai", "api", "mcp"], ["identity_termination"]).exists(a, a.type == "agent"))
    requires: [e.from.attrs.functions]
    domain: 'e.to.type == "mcp_server" && e.from.type != "human_step"'
    message: "{{e.from.name}} reaches MCP server {{e.to.name}} on a path with no gateway enforcing tool allow-lists, scopes and call logging."
    clauses: [OWASP:AgenticTop10:ASI02, OWASP:AgenticTop10:ASI03, MAESTRO:L7]
    remediation: "Put an authenticated MCP gateway between the agent and the server (per-tool allow-list, audience-scoped tokens, call audit); keep the direct route closed."
    patch_template:
      - { op: add, path: "/nodes/-", value: { id: "{{new:gw}}", type: gateway, name: "MCP gateway", layer: platform, attrs: { kind: api, logging: true } } }
      - { op: replace, path: "/edges/{{e.id}}/to", value: "{{new:gw}}" }
      - { op: add, path: "/edges/-", value: { id: "{{new:e}}", from: "{{new:gw}}", to: "{{e.to.id}}", kind: "{{e.kind}}", auth: managed_identity, encryption: tls, attrs: { logged: true } } }
    fixtures: { positive: fixtures/STR-005.pos.json, negative: fixtures/STR-005.neg.json }
    tags: [c4, agentic, mcp, gateway]

  - id: STR-006
    title: Service-to-service relationship authenticated with a shared secret
    scope: edge
    severity: medium
    # B3 (docs/18): reads and writes into a datastore, or into a node hosted_on one, are ZT-001's. A hop between
    # co-located components (one hosted_on the other, or both on one host) is exempt as in NET-006. One credential,
    # one finding: of the hops from one node with one secret into one host (the target's hosted_on, else the target),
    # only the hop into the host itself, else the lowest edge id, reports.
    condition: |
      e.auth in ["api_key","sas","password","connection_string"] &&
      !(e.from.type in ["user","external_party"]) &&
      !(e.kind in ["reads","writes"] && (e.to.type == "datastore" || g.nodes("datastore").exists(d, d.id == attr(e.to, "hosted_on", "")))) &&
      !(attr(e.from, "hosted_on", "") == e.to.id || attr(e.to, "hosted_on", "") == e.from.id ||
        (attr(e.from, "hosted_on", "") != "" && attr(e.from, "hosted_on", "") == attr(e.to, "hosted_on", ""))) &&
      cel.bind(host, attr(e.to, "hosted_on", "") != "" ? attr(e.to, "hosted_on", "") : e.to.id,
        !g.out(e.from.id, "").exists(x, x.id != e.id && x.auth == e.auth &&
          (x.to.id == host || attr(x.to, "hosted_on", "") == host) &&
          ((x.to.id == host && e.to.id != host) || ((x.to.id == host) == (e.to.id == host) && x.id < e.id)) &&
          !(x.kind in ["reads","writes"] && (x.to.type == "datastore" || g.nodes("datastore").exists(d, d.id == attr(x.to, "hosted_on", ""))))))
    severity_override:
      - { when: 'size(e.from.group_ids) + size(e.to.group_ids) > 0 && !e.from.group_ids.exists(gid, gid in e.to.group_ids)', severity: high }
    # The message names the other hops that use the same secret into the same host: the finding stands for them, and
    # the patch replaces auth on the reported hop only, so each sibling reports in turn (docs/03 §STR).
    message: "{{e.from.name}} → {{e.to.name}} authenticates with a shared secret ({{e.auth}}) instead of a workload identity.{{cel.bind(host, attr(e.to, 'hosted_on', '') != '' ? attr(e.to, 'hosted_on', '') : e.to.id, cel.bind(sib, g.out(e.from.id, '').filter(x, x.id != e.id && x.auth == e.auth && (x.to.id == host || attr(x.to, 'hosted_on', '') == host) && !(x.kind in ['reads','writes'] && (x.to.type == 'datastore' || g.nodes('datastore').exists(d, d.id == attr(x.to, 'hosted_on', ''))))), size(sib) == 0 ? '' : ' The same secret also reaches ' + sib.map(x, x.to.name + ' (' + x.id + ')').join(', ') + ': this finding stands for those hops too, and each needs the same change.'))}}"
    clauses: [MCSB:v1:IM-8, MCSB:v1:IM-3, NIST:800-207:S2]
    remediation: "Replace the secret with a workload identity (auth=managed_identity, agent_id, oauth_client or mtls); where a secret is unavoidable keep it in a secret store and rotate it. Datastore reads/writes are assessed by ZT-001."
    patch_template:
      - { op: replace, path: "/edges/{{e.id}}/auth", value: managed_identity }
    fixtures: { positive: fixtures/STR-006.pos.json, negative: fixtures/STR-006.neg.json }
    tags: [c4, identity, secrets, boundary]

  - id: STR-007
    title: Context-level element without any relationship
    scope: node
    severity: low
    condition: |
      (attr(n, "c4_level", "") == "context" ||
       (attr(n, "c4_level", "") == "" &&
        (attr(n, "c4_kind", "") in ["Person","SoftwareSystem","ExternalSystem"] ||
         (attr(n, "c4_kind", "") == "" && n.type in ["user","human_step","product","external_party","saas"])))) &&
      size(g.in(n.id, "")) == 0 && size(g.out(n.id, "")) == 0
    message: "{{n.name}} is a context-level element (person or system) with no relationship to anything else in the model."
    clauses: [NIST:AIRMF:MAP]
    remediation: "Relate the element to the systems it uses or serves, or remove it: an unconnected element is not assessed by any relationship rule and the context view cannot place it."
    fixtures: { positive: fixtures/STR-007.pos.json, negative: fixtures/STR-007.neg.json }
    tags: [c4, structure, orphan]

  - id: STR-008
    title: C4 parent is missing or not above the element
    scope: node
    severity: low
    condition: |
      attr(n, "c4_parent", "") != "" && (
        attr(n, "c4_parent", "") == n.id ||
        !g.nodes.exists(p, p.id == attr(n, "c4_parent", "")) ||
        (attr(n, "c4_level", "") in ["context","container","component","code"] &&
         g.nodes.exists(p, p.id == attr(n, "c4_parent", "") &&
           attr(p, "c4_level", "") in ["context","container","component","code"] &&
           {"context": 0, "container": 1, "component": 2, "code": 3}[attr(p, "c4_level", "")] >=
           {"context": 0, "container": 1, "component": 2, "code": 3}[attr(n, "c4_level", "")])))
    message: "{{n.name}} names {{attr(n,'c4_parent','')}} as its C4 parent, but that element is missing, is the element itself, or is not at a higher C4 level."
    clauses: [NIST:AIRMF:MAP]
    remediation: "Point c4_parent at an existing element one level up (component → container, container → system), or clear it."
    fixtures: { positive: fixtures/STR-008.pos.json, negative: fixtures/STR-008.neg.json }
    tags: [c4, structure, parents]

  # STR-009 to STR-012 (docs/18 WS-I I2, swarm team 01, structure-quality): each reports one structural fact on one
  # node, edge or the graph; none is a path rule and none fires on a note. STR-009 fires only when the model declares
  # at least one zone group, so a model with none is the structure-quality agent's not-checked row, not a finding.
  # STR-010 compares x.to.id, never x.to (g.out returns edges whose endpoints are node maps). STR-012 compares names
  # by equality only, never a regex; one instance modelled on several hosts declares hosted_on and is exempt.
  - id: STR-009
    title: Deployable element outside every zone
    scope: node
    severity: low
    condition: |
      n.type in ["app", "api", "agent", "tool", "mcp_server", "llm_endpoint", "gateway", "datastore", "vector_index",
        "queue", "broker", "log_sink", "secret_store", "identity_provider"] &&
      !n.inZone("zone") && g.nodes.exists(x, x.inZone("zone"))
    message: "{{n.name}} sits in no zone while the model declares zones: the zone and segmentation rules cannot place it."
    clauses: [NIST:AIRMF:MAP, ISO:27001:A.8.27]
    remediation: "Add the element to the zone it runs in (the zone group's node_ids)."
    fixtures: { positive: fixtures/STR-009.pos.json, negative: fixtures/STR-009.neg.json }
    tags: [c4, structure, zones]

  - id: STR-010
    title: Component relationship with no container-level counterpart
    scope: edge
    severity: low
    condition: |
      attr(e.from, "c4_level", "") == "component" && attr(e.from, "c4_parent", "") != "" &&
      e.to.id != attr(e.from, "c4_parent", "") && attr(e.to, "c4_parent", "") != attr(e.from, "c4_parent", "") &&
      !g.out(attr(e.from, "c4_parent", ""), "").exists(x, x.to.id == e.to.id || x.to.id == attr(e.to, "c4_parent", ""))
    requires: [e.from.attrs.c4_level]
    domain: 'attr(e.from, "c4_parent", "") != ""'
    message: "{{e.from.name}} → {{e.to.name}} is a component relationship whose container {{attr(e.from, 'c4_parent', '')}} has no relationship to {{e.to.name}}: the container view does not show a call the component makes."
    clauses: [AIACT:2024/1689:AnnexIV(2)(c), NIST:AIRMF:MAP]
    remediation: "Add the container-level relationship (with its auth and encryption) or correct the component's parent; the assistant asks rather than inventing the relationship."
    fixtures: { positive: fixtures/STR-010.pos.json, negative: fixtures/STR-010.neg.json }
    tags: [c4, structure, relationships]

  - id: STR-011
    title: Superseded decision names no successor
    scope: graph
    severity: low
    condition: |
      attr(g, "decisions", []).exists(d, d.status == "superseded" &&
        (!("superseded_by" in d) || !attr(g, "decisions", []).exists(s, s.id == d.superseded_by)))
    requires: [g.attrs.decisions]
    message: "At least one superseded architecture decision names no successor that exists in the decision log."
    clauses: [NIST:AIRMF:GOVERN, AIACT:2024/1689:AnnexIV(6)]
    remediation: "Set superseded_by on the superseded decision to the id of the decision that replaced it."
    fixtures: { positive: fixtures/STR-011.pos.json, negative: fixtures/STR-011.neg.json }
    tags: [c4, decisions]

  - id: STR-012
    title: Same type and name drawn twice
    scope: node
    severity: low
    # Tools and MCP servers are excluded: a same-named third-party tool is a shadowing finding (AGT-001, TSC-002) of
    # tool-supply-chain, one finding per fact.
    condition: |
      !(n.type in ["tool", "mcp_server"]) && attr(n, "hosted_on", "") == "" &&
      g.nodes.exists(x, x.id != n.id && x.type == n.type && x.name == n.name && attr(x, "hosted_on", "") == "")
    message: "{{n.name}} is drawn more than once with the same type and name: the rules assess each copy on its own and the asset register cannot tell them apart."
    clauses: [NIST:AIRMF:MAP, ISO:27001:A.8.27]
    remediation: "Merge the copies into one element, rename them to the distinct assets they are, or declare hosted_on where one instance runs on several hosts. The assistant asks; it never merges."
    fixtures: { positive: fixtures/STR-012.pos.json, negative: fixtures/STR-012.neg.json }
    tags: [c4, structure, duplicates]
