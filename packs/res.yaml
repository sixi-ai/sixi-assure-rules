# RES — resilience (docs/03 §RES). Deterministic CEL; the LLM never creates findings.
# 0.2.0 (docs/18 WS-I I2, resilience-continuity.md): the pack also applies under NIS2, ISO and CH-CO, so RES-006's
# NIS2 and ISO branches and RES-004, RES-005 and RES-007 (which cite NIS2 and CH-CO clauses) run where they cite.
# 0.3.0 (ADR-105, docs/research/09-agent-swarms-2026.md): RES-008 to RES-012, essential-service continuity when agents
# sit in the control path — a manual path that avoids every agent, more than one model provider, a run budget, a
# declared isolation segment and a recorded degraded-mode test. RES-010 absorbs November backlog N1's step budget
# (OWASP ASI08, cascading failures); FW-005 keeps the loop bound.
pack: res
version: 0.3.0
regimes: [DORA, FINMA, NIS2, ISO, CH-CO]
offer: agentic
rules:
  - id: RES-001
    title: Critical component without geo-redundancy
    scope: node
    severity: high
    condition: 'attr(n, "criticality", "") == "critical" && !attr(n, "geo_redundant", false)'
    requires: [n.attrs.criticality]
    domain: 'n.type in ["agent","llm_endpoint","datastore","app","api","saas"]'
    message: "Critical component {{n.name}} is not geo-redundant."
    clauses: [DORA:2022/2554:Art11-12, FINMA:2023/1:Rz-BCM]
    remediation: "Deploy across paired regions / availability zones with failover (geo_redundant=true)."
    fixtures: { positive: fixtures/RES-001.pos.json, negative: fixtures/RES-001.neg.json }
    tags: [resilience]

  - id: RES-002
    title: Critical component without RTO/RPO
    scope: node
    severity: medium
    condition: 'attr(n, "criticality", "") == "critical" && (attr(n, "rto_min", 0) == 0 || attr(n, "rpo_min", 0) == 0)'
    requires: [n.attrs.criticality]
    domain: 'n.type in ["agent","llm_endpoint","datastore","app","api","saas"]'
    message: "Critical component {{n.name}} has no RTO/RPO defined."
    clauses: [DORA:2022/2554:Art11]
    remediation: "Define recovery time and recovery point objectives (rto_min, rpo_min) and test them."
    fixtures: { positive: fixtures/RES-002.pos.json, negative: fixtures/RES-002.neg.json }
    tags: [resilience, bcm]

  - id: RES-003
    title: Disaster recovery not tested (DORA)
    scope: graph
    severity: low
    condition: 'regime("DORA") && attr(g, "dr_tested_at", "") == ""'
    message: "No disaster-recovery test is recorded for this architecture."
    clauses: [DORA:2022/2554:Art24-26]
    remediation: "Run and record a DR test (dr_tested_at) at least yearly."
    fixtures: { positive: fixtures/RES-003.pos.json, negative: fixtures/RES-003.neg.json }
    tags: [resilience, dora, testing]

  # RES-004 … RES-007 (docs/18 WS-I I2, agents/swarm/05-logging-evidence-and-resilience/resilience-continuity.md):
  # resilience is a property of a node and its direct dependencies, so none is a path rule. A critical component is
  # only as available as what it reads, writes or calls; a store hosted on the node it serves shares its redundancy. A log
  # sink is not a dependency here: a sink outage does not stop the critical function, and the evidence sink is RES-007's.
  - id: RES-004
    title: Critical component depends on a non-redundant store or service
    scope: node
    severity: high
    condition: 'attr(n, "criticality", "") == "critical" && attr(n, "geo_redundant", false) && g.out(n.id, "").exists(x, x.kind in ["reads", "writes", "calls", "subscribes", "publishes"] && x.to.type in ["datastore", "queue", "vector_index", "secret_store", "identity_provider", "llm_endpoint"] && attr(x.to, "hosted_on", "") != n.id && !attr(x.to, "geo_redundant", false))'
    requires: [n.attrs.criticality, n.attrs.geo_redundant]
    domain: 'n.type in ["agent","llm_endpoint","datastore","app","api","saas","queue","vector_index","secret_store","identity_provider","log_sink"]'
    message: "{{n.name}} is critical and geo-redundant, but a store or service it depends on is not: the critical function fails with that dependency."
    clauses: [DORA:2022/2554:Art12(4), FINMA:2023/1:Rz-OpRes, NIS2:2022/2555:Art21(2)(c)]
    remediation: "Make the dependency geo-redundant (paired region, zone or replica), or record why the critical function tolerates its loss; a third party's redundancy is a contract question, not a flag."
    fixtures: { positive: fixtures/RES-004.pos.json, negative: fixtures/RES-004.neg.json }
    tags: [resilience, dependencies]

  # A dependency with undeclared objectives (0) never exceeds the consumer's: the resilience-continuity agent lists it
  # as a not-checked row. No template: recovery objectives are business tolerances a person states.
  - id: RES-005
    title: Dependency recovery objective exceeds the consumer's
    scope: node
    severity: medium
    condition: 'attr(n, "criticality", "") == "critical" && attr(n, "rto_min", 0) > 0 && attr(n, "rpo_min", 0) > 0 && g.out(n.id, "").exists(x, x.kind in ["reads", "writes", "calls", "subscribes", "publishes"] && (attr(x.to, "rto_min", 0) > attr(n, "rto_min", 0) || attr(x.to, "rpo_min", 0) > attr(n, "rpo_min", 0)))'
    requires: [n.attrs.criticality, n.attrs.rto_min, n.attrs.rpo_min]
    domain: 'n.type in ["agent","llm_endpoint","datastore","app","api","saas","queue","vector_index","secret_store","identity_provider","log_sink"]'
    message: "{{n.name}} declares RTO {{attr(n, 'rto_min', 0)}} min / RPO {{attr(n, 'rpo_min', 0)}} min, but a dependency it reads, writes or calls declares longer objectives."
    clauses: [DORA:2022/2554:Art11, FINMA:2023/1:Rz-OpRes, FINMA:2023/1:Rz-BCM]
    remediation: "Align the dependency's recovery objectives with the critical component's tolerance, or restate the component's objectives to what its slowest dependency can meet."
    fixtures: { positive: fixtures/RES-005.pos.json, negative: fixtures/RES-005.neg.json }
    tags: [resilience, bcm, dependencies]

  # RES-003 asks for a recorded test under DORA; FINMA (and NIS2 or ISO where the pack applies) ask the same of an
  # architecture with a critical component. g.nodes has no wildcard type, so the types are enumerated.
  - id: RES-006
    title: Recovery test not recorded (FINMA, NIS2, ISO)
    scope: graph
    severity: low
    condition: '!regime("DORA") && (regime("FINMA") || regime("NIS2") || regime("ISO")) && attr(g, "dr_tested_at", "") == "" && (g.nodes("datastore").exists(n, attr(n, "criticality", "") == "critical") || g.nodes("llm_endpoint").exists(n, attr(n, "criticality", "") == "critical") || g.nodes("agent").exists(n, attr(n, "criticality", "") == "critical") || g.nodes("queue").exists(n, attr(n, "criticality", "") == "critical"))'
    message: "The architecture has a critical component but no recovery test is recorded (dr_tested_at)."
    clauses: [FINMA:2023/1:Rz-BCM, NIS2:2022/2555:Art21(2)(c), ISO:27001:A.5.30]
    remediation: "Test recovery of the critical components and record the date (dr_tested_at); the test report is the evidence."
    fixtures: { positive: fixtures/RES-006.pos.json, negative: fixtures/RES-006.neg.json }
    tags: [resilience, testing, finma]

  # Schema 1.1 (ADR-047 §3b): DATA-005 reads datastores only; the sink the design names as its record of the system
  # is a store too. The purpose guard keeps every model that declares no purpose silent.
  - id: RES-007
    title: Evidence sink without backup or redundancy
    scope: node
    severity: medium
    condition: 'n.type == "log_sink" && attr(n, "purpose", "") == "evidence" && !(attr(n, "backup", false) || attr(n, "geo_redundant", false))'
    requires: [n.attrs.purpose]
    domain: 'n.type == "log_sink"'
    message: "{{n.name}} is the evidence sink but declares neither backup nor geo-redundancy: the record of the system is a single copy."
    clauses: [NIS2:2024/2690:Annex-3.2, DORA-RTS:2024/1774:Art12, CH-CO:958f]
    remediation: "Back the evidence sink up (backup=true) or replicate it (geo_redundant=true); the backup configuration is the evidence."
    patch_template:
      - { op: add, path: "/nodes/{{n.id}}/attrs/backup", value: true }
    fixtures: { positive: fixtures/RES-007.pos.json, negative: fixtures/RES-007.neg.json }
    tags: [resilience, backup, logging]

  # ADR-105: an essential function driven by an agent keeps a manual path. A person (a user or a human step) reaches
  # the critical component by some walk that enters no agent; without one, losing or distrusting the agents stops the
  # function. The person need not be drawn as the operator of record: any drawn manual route counts.
  - id: RES-008
    title: Critical component driven by an agent with no manual path around the agents
    scope: node
    severity: high
    condition: |
      attr(n, "criticality", "") == "critical" &&
      g.inEdges(n.id, "").exists(x, x.kind in ["writes","executes","calls"] && x.from.type == "agent") &&
      !(g.nodes("user") + g.nodes("human_step")).exists(h, g.reachable(h.id, n.id) && g.pathAvoiding(h.id, n.id, "agent"))
    requires: [n.attrs.criticality]
    domain: 'n.type in ["app","api","datastore","queue","saas","edge_device","edge_gateway"] && g.inEdges(n.id, "").exists(x, x.from.type == "agent")'
    message: "{{n.name}} is critical and an agent drives it, but no person reaches it on a path that avoids every agent: if the agents are lost, hijacked or switched off, the function stops."
    clauses: [NIS2:2022/2555:Art21(2)(c), DORA:2022/2554:Art11, FINMA:2023/1:Rz-OpRes, ISO:27001:A.5.30]
    remediation: "Draw and keep a manual route to the critical component that does not depend on any agent (an operator console, a runbook step), and rehearse it (degraded_mode_tested_at)."
    fixtures: { positive: fixtures/RES-008.pos.json, negative: fixtures/RES-008.neg.json }
    tags: [resilience, continuity, agentic, manual-fallback]

  # Concentration from the consumer's side: every model a critical component reaches comes from one provider and none
  # declares an exit strategy, so the loss or withdrawal of that provider stops it. DOR-002 reads several critical
  # services at one provider; this rule reads one critical consumer with no alternative and no plan to get one.
  - id: RES-009
    title: Critical component depends on a single model provider
    scope: node
    severity: medium
    condition: |
      n.type in ["agent","app","api"] && attr(n, "criticality", "") == "critical" &&
      cel.bind(ls, g.nodes("llm_endpoint").filter(l, g.reachable(n.id, l.id)),
        ls.size() > 0 && !ls.exists(l, attr(l, "exit_strategy", false)) &&
        cel.bind(ps, ls.map(l, attr(l, "provider", "")), !ps.exists(p, p == "") && ps.all(p, p == ps[0])))
    requires: [n.attrs.criticality]
    domain: 'n.type in ["agent","app","api"] && g.nodes("llm_endpoint").exists(l, g.reachable(n.id, l.id))'
    message: "{{n.name}} is critical, every model it reaches comes from {{g.nodes('llm_endpoint').filter(l, g.reachable(n.id, l.id)).map(l, attr(l, 'provider', ''))[0]}} and none declares an exit strategy: an outage, withdrawal or compromise of that one provider stops it."
    clauses: [DORA:2022/2554:Art28(8), DORA:2022/2554:Art29, FINMA:2023/1:Rz-OpRes, NIS2:2022/2555:Art21(2)(d)]
    remediation: "Give the critical function a second model from another provider, or a tested exit strategy (exit_strategy=true on the endpoint) and a degraded mode that works without a model."
    fixtures: { positive: fixtures/RES-009.pos.json, negative: fixtures/RES-009.neg.json }
    tags: [resilience, continuity, agentic, concentration]

  # A run budget (ASI08, cascading failures): an agent that drives a critical component declares its tool-call budget
  # unbounded (max_tool_calls=0) and no time bound. An undeclared budget is not_checked (ADR-088 §4, as in the fw pack);
  # a loop declared unbounded with no time bound stays FW-005's.
  - id: RES-010
    title: Agent drives a critical component with no run budget
    scope: node
    severity: medium
    condition: |
      n.type == "agent" && attr(n, "autonomy", "") in ["semi","autonomous"] &&
      attr(n, "max_tool_calls", -1) == 0 && attr(n, "max_duration_s", 0) == 0 && attr(n, "max_iterations", -1) != 0 &&
      g.outEdges(n.id, "").exists(x, x.kind in ["writes","executes","calls"] && attr(x.to, "criticality", "") == "critical")
    requires: [n.attrs.autonomy, n.attrs.max_tool_calls]
    domain: 'n.type == "agent" && g.outEdges(n.id, "").exists(x, attr(x.to, "criticality", "") == "critical")'
    message: "{{n.name}} drives a critical component, declares its tool calls unbounded (max_tool_calls=0) and sets no time bound: one bad run can cascade into the function it serves."
    clauses: [DORA:2022/2554:Art9, NIS2:2022/2555:Art21, FINMA:2023/1:Rz-OpRes]
    remediation: "Bound every run of the agent: a tool-call budget (max_tool_calls) and a time limit (max_duration_s), enforced by the runtime, so a failing run stops before it spreads."
    fixtures: { positive: fixtures/RES-010.pos.json, negative: fixtures/RES-010.neg.json }
    tags: [resilience, agentic, cascading-failure, budget]

  # Containment needs somewhere to go. An architecture with two or more steerable agents and either edge devices or a
  # critical component declares a group of kind isolation: the segment a compromised component is moved to or cut off
  # in. The group is a declaration; the cut-off procedure is the evidence.
  - id: RES-011
    title: Agent fleet with no declared isolation segment
    scope: graph
    severity: low
    condition: |
      g.nodes("agent").filter(a, attr(a, "autonomy", "") in ["semi","autonomous"]).size() >= 2 &&
      (g.has("edge_device") || g.nodes.exists(x, attr(x, "criticality", "") == "critical")) &&
      !g.groups.exists(gr, gr.kind == "isolation")
    message: "The architecture runs {{g.nodes('agent').filter(a, attr(a, 'autonomy', '') in ['semi','autonomous']).size()}} steerable agents beside edge devices or a critical component, but declares no isolation segment to move a compromised component into."
    clauses: [NIS2:2024/2690:Annex-6.8, DORA:2022/2554:Art9, ISO:27001:A.8.22]
    remediation: "Declare an isolation group (kind isolation): the network segment or account a compromised agent or device is moved into, and write down who triggers the move."
    fixtures: { positive: fixtures/RES-011.pos.json, negative: fixtures/RES-011.neg.json }
    tags: [resilience, containment, agentic, isolation]

  - id: RES-012
    title: Degraded mode without the agents never tested
    scope: graph
    severity: low
    condition: |
      attr(g, "degraded_mode_tested_at", "") == "" &&
      g.nodes.exists(x, attr(x, "criticality", "") == "critical" &&
        g.inEdges(x.id, "").exists(e, e.kind in ["writes","executes","calls"] && e.from.type == "agent"))
    message: "An agent drives a critical component, but no test of the function running without its agents and model providers is recorded (degraded_mode_tested_at)."
    clauses: [NIS2:2022/2555:Art21(2)(c), DORA:2022/2554:Art11, FINMA:2023/1:Rz-BCM, ISO:27001:A.5.30]
    remediation: "Run the essential function with its agents and model providers switched off, at least yearly, and record the date (degraded_mode_tested_at); the test report is the evidence."
    fixtures: { positive: fixtures/RES-012.pos.json, negative: fixtures/RES-012.neg.json }
    tags: [resilience, continuity, agentic, testing]
