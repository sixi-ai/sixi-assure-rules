# GXP — electronic records and signatures in GMP-regulated systems (docs/03 §GXP). Cites 21 CFR Part 11 (FDA) and
# EudraLex Volume 4 GMP Annex 11, revision 1 (EU-GMP); the texts were checked against eCFR and the Commission PDF.
# Every condition gates on a declared regime: the pack speaks only where GxP record-keeping is declared. GAMP 5 is
# industry guidance, not law — its sections are cited beside the clause that carries the obligation, never instead of it.
pack: gxp
version: 0.3.0
regimes: [FDA, EU-GMP, GAMP]
offer: pharma
rules:
  - id: GXP-001
    title: No immutable audit trail for GxP records
    scope: graph
    severity: high
    condition: '(regime("FDA") || regime("EU-GMP")) && !g.nodes("log_sink").exists(l, attr(l, "immutable", false))'
    message: "GxP record-keeping applies, but the architecture models no immutable audit trail that records who created, changed or deleted data, when and why."
    clauses: [FDA:21CFR11:11.10(e), EU-GMP:Annex11:9, EU-GMP:Annex11:12]
    remediation: "Add a secure, computer-generated, time-stamped audit trail that changes cannot obscure (a log sink with immutable=true and a retention at least as long as the records), and review it regularly."
    fixtures: { positive: fixtures/GXP-001.pos.json, negative: fixtures/GXP-001.neg.json }
    tags: [gxp, audit-trail, records]

  - id: GXP-002
    title: Electronic approval not bound to the signer's own identity
    scope: node
    severity: high
    condition: |
      n.type == "human_step" && size(attr(n, "approval_for", [])) > 0 && attr(n, "approval_identity", "") != "separate" &&
      (regime("FDA") || regime("EU-GMP"))
    requires: [n.attrs.approval_for]
    domain: 'n.type == "human_step" && (regime("FDA") || regime("EU-GMP"))'
    message: "{{n.name}} records approvals, but they are not declared as signed under the approver's own identity (approval_identity={{attr(n, 'approval_identity', 'not declared')}}): an electronic signature must be unique to one person and linked to its record."
    clauses: [FDA:21CFR11:11.100(a), FDA:21CFR11:11.200(a), FDA:21CFR11:11.70, EU-GMP:Annex11:14]
    remediation: "Sign each approval under the approver's own identity — never a shared or service identity — and link the signature, with name, date, time and meaning, to the record it approves (approval_identity=separate)."
    patch_template:
      - { op: add, path: "/nodes/{{n.id}}/attrs/approval_identity", value: separate }
    fixtures: { positive: fixtures/GXP-002.pos.json, negative: fixtures/GXP-002.neg.json }
    tags: [gxp, electronic-signatures, identity]

  - id: GXP-003
    title: GxP data store without backups
    scope: node
    severity: high
    condition: |
      n.type == "datastore" && attr(n, "data_class", "") != "public" && !attr(n, "backup", false) &&
      (regime("FDA") || regime("EU-GMP"))
    message: "{{n.name}} holds GMP-relevant data without backups: records must stay retrievable, readable and accurate throughout their retention period."
    clauses: [FDA:21CFR11:11.10(c), EU-GMP:Annex11:7, GAMP:5-Ed2:O9]
    remediation: "Back up the store regularly and check during validation, and periodically after, that the backups can be restored intact (backup=true)."
    patch_template:
      - { op: add, path: "/nodes/{{n.id}}/attrs/backup", value: true }
    fixtures: { positive: fixtures/GXP-003.pos.json, negative: fixtures/GXP-003.neg.json }
    tags: [gxp, backup, retention]

  - id: GXP-004
    title: Configured or custom GxP software without a supplier assessment
    scope: node
    severity: medium
    condition: |
      attr(n, "gamp_category", "") in ["configured", "custom"] && !attr(n, "supplier_assessed", false) &&
      (regime("GAMP") || regime("FDA") || regime("EU-GMP"))
    requires: [n.attrs.gamp_category]
    domain: '(regime("GAMP") || regime("FDA") || regime("EU-GMP")) && n.type in ["agent","llm_endpoint","datastore","tool","mcp_server","app","api","saas","edge_model"]'
    message: "{{n.name}} is {{attr(n, 'gamp_category', '')}} software in a GxP system, but no assessment of its supplier or development team is recorded: what the supplier does for quality decides what you still have to verify yourself."
    clauses: [GAMP:5-Ed2:M2, GAMP:5-Ed2:M4, EU-GMP:Annex11:3, FDA:21CFR11:11.10]
    remediation: "Assess the supplier, or the team that wrote the code, against the risk of the system — quality system, development and testing practice, support and updates — file the assessment, and let its outcome set the verification you do yourself (supplier_assessed=true)."
    fixtures: { positive: fixtures/GXP-004.pos.json, negative: fixtures/GXP-004.neg.json }
    tags: [gxp, supplier, gamp, risk-based]

  # Team 09 (agents/swarm/09-sector-packs/gxp-records.md, docs/18 WS-I I2): GXP-005 to GXP-008.
  - id: GXP-005
    title: Audit trail retained shorter than the records it covers
    scope: node
    severity: high
    condition: |
      n.type == "datastore" && attr(n, "data_class", "") != "public" && attr(n, "retention_days", 0) > 0 &&
      (regime("FDA") || regime("EU-GMP")) &&
      !g.nodes("log_sink").exists(l, attr(l, "immutable", false) && attr(l, "retention_days", 0) >= attr(n, "retention_days", 0))
    requires: [n.attrs.data_class, n.attrs.retention_days]
    domain: '(regime("FDA") || regime("EU-GMP")) && n.type == "datastore"'
    message: "{{n.name}} keeps GMP records for {{attr(n, 'retention_days', 0)}} days, but no immutable audit trail is kept that long: the trail that explains a record expires before the record."
    clauses: [FDA:21CFR11:11.10(e), EU-GMP:Annex11:9, EU-GMP:Annex11:17, GAMP:5-Ed2:O13]
    remediation: "Keep the audit trail at least as long as the records it covers (retention_days on the immutable log sink at or above the store's), and keep both readable through that period."
    fixtures: { positive: fixtures/GXP-005.pos.json, negative: fixtures/GXP-005.neg.json }
    tags: [gxp, audit-trail, retention]

  - id: GXP-006
    title: Record write that reaches no audit trail
    scope: edge
    severity: high
    condition: |
      e.kind in ["writes","executes"] && e.to.type == "datastore" && attr(e.to, "data_class", "") != "public" &&
      (regime("FDA") || regime("EU-GMP")) && !attr(e, "logged", false) &&
      !g.out(e.from.id, "writes").exists(o, o.to.type == "log_sink" && attr(o.to, "immutable", false)) &&
      !g.out(e.to.id, "writes").exists(o, o.to.type == "log_sink" && attr(o.to, "immutable", false))
    requires: [e.to.attrs.data_class]
    domain: 'e.kind in ["writes","executes"] && e.to.type == "datastore" && (regime("FDA") || regime("EU-GMP"))'
    message: "{{e.from.name}} writes GMP records to {{e.to.name}}, but the write is not declared logged and neither component writes an immutable audit trail: who changed which record, when and why is not recorded."
    clauses: [FDA:21CFR11:11.10(e), EU-GMP:Annex11:9, EU-GMP:Annex11:12, ISO:27001:A.8.15]
    remediation: "Record every create, change and delete on GMP records in the secure, time-stamped audit trail: declare the write logged (logged=true) and let the writer or the store write the immutable log sink."
    patch_template:
      - { op: add, path: "/edges/{{e.id}}/attrs/logged", value: true }
    fixtures: { positive: fixtures/GXP-006.pos.json, negative: fixtures/GXP-006.neg.json }
    tags: [gxp, audit-trail, records]

  - id: GXP-007
    title: Electronic signature recorded in no audit trail
    scope: node
    severity: high
    condition: |
      n.type == "human_step" && size(attr(n, "approval_for", [])) > 0 && (regime("FDA") || regime("EU-GMP")) &&
      !g.out(n.id, "*").exists(o, attr(o, "logged", false) || (o.to.type == "log_sink" && attr(o.to, "immutable", false)))
    requires: [n.attrs.approval_for]
    domain: 'n.type == "human_step" && (regime("FDA") || regime("EU-GMP"))'
    message: "{{n.name}} signs approvals, but none of its acts is declared logged or written to an immutable audit trail: the signature cannot stay linked to the record it approves."
    clauses: [FDA:21CFR11:11.70, FDA:21CFR11:11.50, FDA:21CFR11:11.10(e), EU-GMP:Annex11:14, EU-GMP:Annex11:9]
    remediation: "Record each signature with the signer's name, date, time and meaning in the audit trail of the record it approves: declare the step's act logged (logged=true) or let it write the immutable log sink."
    fixtures: { positive: fixtures/GXP-007.pos.json, negative: fixtures/GXP-007.neg.json }
    tags: [gxp, electronic-signatures, audit-trail]

  - id: GXP-008
    title: Autonomous agent reaches a GMP record write on a walk with no human step
    scope: edge
    severity: high
    condition: |
      e.kind in ["writes","executes"] && e.to.type == "datastore" && attr(e.to, "data_class", "") != "public" &&
      (regime("FDA") || regime("EU-GMP")) &&
      g.nodes("agent").exists(a, attr(a, "autonomy", "") in ["semi", "autonomous"] &&
        (a.id == e.from.id || g.pathAvoiding(a.id, e.from.id, "human_step")))
    requires: [e.to.attrs.data_class]
    domain: 'e.kind in ["writes","executes"] && e.to.type == "datastore" && (regime("FDA") || regime("EU-GMP"))'
    message: "{{e.from.name}} writes GMP records to {{e.to.name}}, and a semi-autonomous or autonomous agent reaches it on a walk with no human step: a steered model can change a record no authorised person entered."
    clauses: [FDA:21CFR11:11.10(g), EU-GMP:Annex11:12, AIACT:2024/1689:Art14, GAMP:AI:M9]
    remediation: "Put a person under their own identity between the agent and every write into GMP records: the agent drafts, a named role enters or approves the record, and the approval is in the audit trail."
    fixtures: { positive: fixtures/GXP-008.pos.json, negative: fixtures/GXP-008.neg.json }
    tags: [gxp, agents, human-oversight]
